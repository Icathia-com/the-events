<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Events</title>
  <meta name="theme-color" content="#9A4F33">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/pages/index.js"></script>
</head>
<body class="is-loading">
  <main class="page">
    <header class="home-head">
      <div class="home-hello">
        <span class="home-date" id="today"></span>
        <h1 class="home-greet" id="greeting"></h1>
        <span class="home-impact" id="impact" hidden></span>
      </div>
      <span id="avatar"></span>
    </header>
    <div class="qa-row" id="quick"></div>

    <div class="sec"><h2>Your events<span class="count" id="up-count"></span></h2><a class="sec-link" href="profile.html" id="past-link">Past events</a></div>
    <div id="upcoming"></div>
    <div class="claims" id="claims"></div>

    <div class="sec"><h2>Organisations you follow<span class="count" id="org-count"></span></h2><a class="sec-link" href="organisations.html" id="orgs-link">See all</a></div>
    <div class="org-grid" id="followed"></div>

    <section class="glass cal" aria-label="Your shifts">
      <div class="cal-head">
        <span class="cal-month" id="cal-month"></span>
        <span class="cal-tools"><span class="cal-label">Your shifts</span><button type="button" class="cal-today hit" id="cal-today" aria-label="Jump to today"></button></span>
      </div>
      <div class="cal-days" id="cal-days" role="group" aria-label="Your shifts by day"></div>
    </section>

    <div class="sec" id="all">
      <h2 class="sec-stack"><span>All events</span><span class="sec-sub" id="sample-note" hidden>Sample events</span></h2>
      <span class="sec-tools">
        <span class="menu-wrap">
          <button type="button" class="pill-btn hit" id="area-btn" aria-haspopup="true" aria-expanded="false"></button>
          <div class="menu" role="menu" id="area-menu" hidden></div>
        </span>
      </span>
    </div>
    <div id="groups"></div>
  </main>
</body>
</html>
