  constructor(props) { super(props); let d = null; try { d = JSON.parse(localStorage.getItem('vn.draft') || 'null'); } catch (e) {} this.state = Object.assign(this.blank(), { hasDraft: !!(d && d.title) }); }

  dragDown(id, axis) { return (e) => { if (e.button !== 0) return; if (this._dragId) return; const t = e.target; if (t && t.closest && t.closest('input,textarea,select,label')) return; const el = document.getElementById(id); if (!el) return; this._dragId = id; this._ax = axis; this._p0 = axis === 'x' ? e.clientX : e.clientY; this._s0 = axis === 'x' ? el.scrollLeft : el.scrollTop; this._moved = false; }; }

    const CAUSES = { food: 'Food', elderly: 'Elderly', children: 'Children', environment: 'Environment', animals: 'Animals', education: 'Education' };
    const TODAY = '2026-10-27';
    const loadNew = () => { try { const v = JSON.parse(localStorage.getItem('vn.newEvents') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
    const coverStyle = (c, w, h, r, fs) => 'width:' + w + ';height:' + h + 'px;border-radius:' + r + 'px;flex-shrink:0;box-sizing:border-box;padding:' + Math.round(h / 9) + 'px;display:flex;align-items:flex-end;background:' + (c[3] ? 'center/cover no-repeat url(' + c[3] + ')' : 'linear-gradient(135deg,' + c[0] + ' 0%,' + c[1] + ' 100%)') + ';color:#FFFFFF;font-size:' + fs + 'px;font-weight:800;letter-spacing:.02em;line-height:1.05;white-space:pre-line;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)';
    const st = this.state;
    const COVERS = [['#7A3E2A', '#D08A5E'], ['#2E5C44', '#5FA37B'], ['#1F4E6E', '#5B9BC2'], ['#8A5A1E', '#D9A24A'], ['#5A3E7A', '#9C7BC4'], ['#3E5A1E', '#8CB83E']];
    const coverWords = (t) => { const w = String(t || 'Your event').toUpperCase().split(/\s+/).filter(Boolean); let a = '', b = ''; w.forEach((x) => { if (!b && (a + ' ' + x).trim().length <= 12) a = (a + ' ' + x).trim(); else if ((b + ' ' + x).trim().length <= 14) b = (b + ' ' + x).trim(); }); return b ? a + '\n' + b : a; };
    const fmt = (hm) => { const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); if (!m) return ''; let h = Number(m[1]); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; };
    const c = COVERS[st.cover] || COVERS[0];
    const coverArr = [c[0], c[1], coverWords(st.title)].concat(st.photo ? [st.photo] : []);
    const chip = (on) => 'height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .25s ease,color .25s ease;border:1px solid ' + (on ? '#24412F' : 'rgba(30,26,23,.12)') + ';background:' + (on ? '#24412F' : 'rgba(255,255,255,.8)') + ';color:' + (on ? '#FFFFFF' : '#1E1A17');
    const track = (on) => 'position:relative;width:52px;height:30px;border-radius:15px;border:0;padding:0;cursor:pointer;flex-shrink:0;transition:background .25s ease;background:' + (on ? '#24412F' : 'rgba(30,26,23,.18)');
    const knob = (on) => 'position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s ease;transform:translateX(' + (on ? 22 : 0) + 'px)';
    const can = st.title.trim().length > 0;
    const set = (k) => (e) => this.keep({ [k]: e.target.value });
    const locLabel = st.area ? (AREAS[st.area] + (st.venue ? ' · ' + st.venue : '')) : (st.venue || 'Choose location');
    const firstLine = String(st.desc || '').split('\n')[0];
    const create = () => {
      if (!can) return;
      const id = 'new-' + Date.now();
      const ev = { id: id, day: st.date || TODAY, time: fmt(st.start), end: fmt(st.end), title: st.title.trim(), org: 'silver', area: st.area || 'islandwide', place: st.venue, meet: st.meet, cause: st.cause, bring: st.bring,
        cover: [c[0], c[1], coverWords(st.title)].concat(st.photo && st.photo.length < 900000 ? [st.photo] : []), desc: st.desc, appr: st.appr, price: st.paid ? st.price : '', cap: st.cap ? Number(st.cap) : 0, left: st.cap ? Number(st.cap) : 999, vis: st.vis };
      try { const list = loadNew(); list.push(ev); localStorage.setItem('vn.newEvents', JSON.stringify(list)); localStorage.setItem('vn.ev', id); localStorage.removeItem('vn.draft'); } catch (err) {}
      this.setState({ done: true });
    };
    return {
      editing: !st.done, done: st.done, barTitle: st.done ? 'Event created' : 'Create event',
      showRestore: st.hasDraft && !st.title,
      restore: () => { let d = {}; try { d = JSON.parse(localStorage.getItem('vn.draft') || '{}') || {}; } catch (e) {} this.setState(Object.assign({}, d, { hasDraft: false })); },
      dismissDraft: () => { try { localStorage.removeItem('vn.draft'); } catch (e) {} this.setState({ hasDraft: false }); },
      coverPrev: coverStyle(coverArr, '270px', 270, 26, 30) + ';box-shadow:0 16px 36px rgba(90,50,30,.25)', coverText: coverArr[2],
      nextCover: () => this.keep({ cover: (st.cover + 1) % COVERS.length, photo: '' }),
      pickPhoto: (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => this.setState({ photo: String(r.result || '') }); r.readAsDataURL(f); },
      title: st.title, setTitle: set('title'), date: st.date, setDate: (e) => this.keep({ date: e.target.value, endDate: st.endDate < e.target.value ? e.target.value : st.endDate }),
      start: st.start, setStart: set('start'), endDate: st.endDate, setEndDate: set('endDate'), end: st.end, setEnd: set('end'),
      locOpen: st.locOpen, locOpenText: String(st.locOpen), toggleLoc: () => this.setState({ locOpen: !st.locOpen }),
      locLabel: locLabel, locLabStyle: 'flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px;font-weight:600;color:' + (st.area || st.venue ? '#1E1A17' : '#6B5E55'),
      areaChips: Object.keys(AREAS).map((id) => ({ label: AREAS[id], on: String(id === st.area), style: chip(id === st.area), pick: () => this.keep({ area: id }) })),
      venue: st.venue, setVenue: set('venue'), meet: st.meet, setMeet: set('meet'),
      descOpen: st.descOpen, descOpenText: String(st.descOpen), toggleDesc: () => this.setState({ descOpen: !st.descOpen }),
      descLabel: firstLine || 'Add description', descLabStyle: 'flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px;font-weight:600;color:' + (firstLine ? '#1E1A17' : '#6B5E55'),
      desc: st.desc, setDesc: set('desc'), bring: st.bring, setBring: set('bring'),
      apprOn: String(st.appr), apprTrack: track(st.appr), apprKnob: knob(st.appr), toggleAppr: () => this.keep({ appr: !st.appr }),
      paid: st.paid, priceLabel: st.paid ? (st.price ? 'S$' + st.price : 'Paid') : 'Free', togglePrice: () => this.keep({ paid: !st.paid }), price: st.price, setPrice: set('price'),
      cause: st.cause, setCause: set('cause'), causeOpts: Object.keys(CAUSES).map((k) => ({ id: k, label: CAUSES[k] })),
      vis: st.vis, setVis: set('vis'), cap: st.cap, setCap: set('cap'),
      notifyOn: String(st.notify), notTrack: track(st.notify), notKnob: knob(st.notify), toggleNotify: () => this.keep({ notify: !st.notify }),
      cantCreate: !can, create: create,
      bigBtn: 'height:56px;border-radius:28px;border:0;font-size:16px;font-weight:700;flex-shrink:0;margin-top:6px;cursor:' + (can ? 'pointer' : 'default') + ';background:' + (can ? '#24412F' : 'rgba(30,26,23,.15)') + ';color:' + (can ? '#FFFFFF' : 'rgba(30,26,23,.45)'),
      doneTitle: st.title.trim() || 'Event created',
      doneLine: (st.vis === 'draft' ? 'Saved as a draft. Only your organisation can see it.' : (st.vis === 'followers' ? 'Volunteers who follow you can see it in Events.' : 'Every volunteer can see it in Events.')) + (st.notify && st.vis !== 'draft' ? ' Your followers are notified.' : ''),
      again: () => this.setState(this.blank()),
      vDown: this.dragDown('evc', 'y'), dMove: this.dragMove(), dUp: this.dragUp(), guard: this.clickGuard()
    };
  }
}
</script>
